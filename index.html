<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Living | Premium Property Listings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">OBSIDIAN LIVING</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#properties">Properties</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Find Your Next Home</h1>
        <div class="search-container">
            <input type="text" placeholder="Location, City, or ZIP...">
            <button class="btn-primary">Search</button>
        </div>
    </header>

    <section id="properties" class="property-section">
        <h2 class="section-title">Featured Listings</h2>
        <div class="property-grid" id="listing-container">
            <div class="property-card">
                <div class="property-image" style="background-image: url('property1.jpg');">
                    <span class="tag">For Rent</span>
                </div>
                <div class="property-info">
                    <h3>Modern 3-Bedroom Apartment</h3>
                    <p class="location">East Legon, Accra</p>
                    <div class="specs">
                        <span>3 Beds</span> • <span>2 Baths</span> • <span>1,200 sqft</span>
                    </div>
                    <div class="price">$1,500/month</div>
                    <button class="btn-secondary">View Details</button>
                </div>
            </div>
            </div>
    </section>

    <footer>
        <p>&copy; 2026 Obsidian Living. All rights reserved.</p>
    </footer>

</body>
</html>
